<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <main class="player-area">
            <div class="video-container">
                <video id="iptv-video" controls autoplay width="100%"></video>
                <div id="loading-spinner" class="loading-overlay" style="display: none;">
                    <div class="spinner"></div>
                </div>
            </div>
            <div class="controls-container">
                <button id="play-pause-btn" title="Play/Pause">Play</button>
                <div class="volume-control">
                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1" title="Volume">
                </div>
                <div class="quality-selector" style="display: none;">
                    <label for="quality-select" style="margin-right: 5px;">Quality:</label>
                    <select id="quality-select" style="display: none;" title="Select Quality">
                        <!-- Options will be populated by JavaScript -->
                    </select>
                </div>
                <button id="seek-back-btn" title="Seek Back 30s" style="display: none;">&laquo; 30s</button>
                <button id="go-live-btn" title="Go Live" style="display: none;">LIVE</button>
                <span id="latency-display" style="display: none; font-size: 0.85em; margin-left: auto; align-self: center;"></span>
                <button id="fullscreen-btn" title="Toggle Fullscreen">Fullscreen</button>
            </div>
        </main>
        <aside class="channel-list-container">
            <h2>Channel List</h2>
            <ul id="channel-list">
                <!-- Channels will be populated by JavaScript -->
            </ul>
            <div id="epg-info-container" style="display: none;">
                <h3 id="epg-channel-name" style="display: none;"></h3>
                <p id="epg-message" style="display: none;"></p> <!-- For status/error messages -->
                <div id="epg-current-program" style="display: none;">
                    <p class="epg-program-time">Now:</p>
                    <p id="epg-current-title" class="epg-program-title"></p>
                    <p id="epg-current-desc" class="epg-program-desc"></p>
                </div>
                <div id="epg-next-program" style="display: none;">
                    <p class="epg-program-time">Next:</p>
                    <p id="epg-next-title" class="epg-program-title"></p>
                    <p id="epg-next-desc" class="epg-program-desc"></p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
