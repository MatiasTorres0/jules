<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <main class="player-area">
            <div class="video-container">
                <video id="iptv-video" controls autoplay width="100%"></video>
                <div id="loading-spinner" class="loading-overlay" style="display: none;">
                    <div class="spinner"></div>
                </div>
            </div>
            <div class="controls-container">
                <div class="controls-group left">
                    <button id="play-pause-btn" title="Play/Pause" aria-label="Play or Pause Video">Play</button>
                    <!-- Consider adding icons here later e.g. <i class="icon play-icon"></i> <span class="button-text sr-only">Play</span> -->
                    <button id="seek-back-btn" title="Seek Back 30s" style="display: none;" aria-label="Seek back 30 seconds">&laquo; 30s</button>
                    <button id="go-live-btn" title="Go Live" style="display: none;" aria-label="Go to live broadcast">LIVE</button>
                </div>

                <div class="controls-group center">
                    <!-- This group can be used for a timeline/scrubber in the future -->
                    <span id="latency-display" style="display: none; font-size: 0.85em; align-self: center;"></span>
                </div>

                <div class="controls-group right">
                    <div class="quality-selector" style="display: none;">
                        <label for="quality-select" style="margin-right: 5px;">Quality:</label>
                        <select id="quality-select" style="display: none;" title="Select Quality" aria-label="Select video quality">
                            <!-- Options will be populated by JavaScript -->
                        </select>
                    </div>
                    <div class="volume-control">
                        <!-- Consider adding mute button icon here -->
                        <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1" title="Volume" aria-label="Volume control">
                    </div>
                    <button id="fullscreen-btn" title="Toggle Fullscreen" aria-label="Toggle fullscreen mode">Fullscreen</button>
                </div>
            </div>
        </main>
        <aside class="channel-list-container">
            <h2>Channel List</h2>
            <ul id="channel-list" role="listbox" aria-label="Channel list">
                <!-- Channels will be populated by JavaScript (li elements should have role="option") -->
            </ul>
            <div id="epg-info-container" style="display: none;" role="region" aria-live="polite" aria-atomic="true">
                <h3 id="epg-channel-name" style="display: none;"></h3>
                <p id="epg-message" style="display: none;"></p> <!-- For status/error messages -->
                <div id="epg-current-program" style="display: none;">
                    <p class="epg-program-time">Now:</p>
                    <p id="epg-current-title" class="epg-program-title"></p>
                    <p id="epg-current-desc" class="epg-program-desc"></p>
                </div>
                <div id="epg-next-program" style="display: none;">
                    <p class="epg-program-time">Next:</p>
                    <p id="epg-next-title" class="epg-program-title"></p>
                    <p id="epg-next-desc" class="epg-program-desc"></p>
                </div>
            </div>
        </aside> <!-- Corrected closing tag placement -->
    </div>
    <script src="script.js"></script>
</body>
</html>
